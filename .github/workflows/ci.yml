name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 统一入口：build.mjs（tsc + esbuild bundle → dist/extension.js）——
      # e2e 用 @vscode/test-electron 加载的正是 main=dist/extension.js 的 bundle
      - run: npm run build
      - run: npm run test:unit
      # git 状态追踪端到端（fake ssh + 本地 git，无需外部服务器）
      - name: Git status integration (fake ssh)
        run: node test/e2e-git.js
      - name: E2E (real VS Code, xvfb)
        # 统一走 npm script：xvfb 禁用 GLX 扩展，否则 Electron/Xvfb 在 Ubuntu runner 上 SIGSEGV
        run: npm run test:e2e
      # 打包产物防回归（统一入口 scripts/package.mjs 内置验证：node-pty prebuilds、
      # 无 .pdb、ssh2 已 bundle 进 dist、vsix 大小）
      - name: Package + verify (unified entry)
        run: npm run package -- --out /tmp/ci-check.vsix
