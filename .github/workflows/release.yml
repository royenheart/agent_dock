name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:unit
      - name: Package extension
        # 必须打包 dependencies（node-pty + ssh2）：--no-dependencies 会产出缺运行时
        # 依赖的 vsix（~380KB），导致客户端终端失去真 pty、持久 SSH/SFTP 不可用
        run: npx @vscode/vsce package
      - name: Verify runtime deps are bundled (packaging red line)
        run: |
          test "$(unzip -l *.vsix | grep -c 'node-pty')" -gt 0
          test "$(unzip -l *.vsix | grep -c 'node-pty/prebuilds/.*\.node')" -ge 8
          test "$(unzip -l *.vsix | grep -c 'ssh2/')" -gt 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

      # Marketplace 发布暂时关闭：手动上传 vsix 到
      # https://marketplace.visualstudio.com/manage （More Actions → 上传/更新扩展）
