name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 编译与打包统一走 scripts/（build.mjs esbuild bundle + package.mjs 打包+验证），
      # 与本地 `npm run package` 完全同一入口——改打包方式只需改 scripts/ 与 package.json
      - run: npm run build
      - run: npm run test:unit
      - name: Package + verify (unified entry)
        run: npm run package
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
          # 按语义版本比较：仅当新 tag 版本号更高时才设为 Latest，
          # 避免并发发布时低版本 release 抢走 Latest 徽标
          make_latest: 'legacy'

      # Marketplace 发布暂时关闭：手动上传 vsix 到
      # https://marketplace.visualstudio.com/manage （More Actions → 上传/更新扩展）
